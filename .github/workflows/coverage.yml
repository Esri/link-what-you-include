name: Coverage

on:
  schedule:
    - cron: '42 3 * * *'
      timezone: "America/Los_Angeles"
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'esri/link-what-you-include' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - name: Setup linux environment
        run: |
          sudo apt install clang-18 libclang-18-dev libsimdjson-dev catch2
          cat << EOF >> $GITHUB_ENV
          Clang_ROOT=/usr/lib/llvm-18
          CMAKE_GENERATOR=Ninja
          EOF

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and test with coverage
        shell: ctest -VV -S {0}
        run: |
          include($ENV{GITHUB_WORKSPACE}/.github/workflows/common_ctest.cmake)

          set(CTEST_CONFIGURATION_TYPE Debug)
          set(CTEST_SOURCE_DIRECTORY $ENV{GITHUB_WORKSPACE})
          set(CTEST_BINARY_DIRECTORY $ENV{GITHUB_WORKSPACE}/build/coverage)
          set(CTEST_BUILD_NAME ${CMAKE_SYSTEM_NAME}.coverage)

          find_program(CTEST_COVERAGE_COMMAND NAMES gcov)
          set(configure_opts
            -DCMAKE_CXX_FLAGS_INIT=--coverage
            )
          #set(CTEST_CUSTOM_COVERAGE_EXCLUDE $ENV{GITHUB_WORKSPACE}/3rdparty)

          set(model Experimental)
          if($ENV{GITHUB_EVENT_NAME} STREQUAL schedule)
            set(model Nightly)
          endif()

          ctest_start(${model})
          ctest_update()
          ctest_configure(OPTIONS "${configure_opts}")
          ctest_build(RETURN_VALUE result NUMBER_ERRORS errors NUMBER_WARNINGS warnings)
          if(NOT result EQUAL 0)
            ctest_submit()
            message(FATAL_ERROR "ctest_build failed with ${errors} errors and ${warnings} warnings")
          endif()
          ctest_test(RETURN_VALUE result)
          ctest_coverage()
          ctest_submit()

          if((NOT result EQUAL 0) OR (errors GREATER 0) OR (warnings GREATER 0))
            message(FATAL_ERROR "ctest_test returned ${result} for build with ${errors} errors ${warnings} warnings")
          endif()
